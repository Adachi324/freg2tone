name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: node --experimental-strip-types --test tests/game.test.ts tests/lesson-web.test.mjs tests/explore-model.test.mjs tests/explore-v1.test.mjs tests/course-model.test.mjs tests/course-content.test.mjs
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          DEPLOY_BASE: /music/
      - name: Install browser for interaction regression
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Verify audio and button interactions
        working-directory: app
        run: |
          npm run preview > /tmp/fret-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8877/lesson-1/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/audio-interaction-browser.mjs
          node tests/explore-feedback-browser.mjs
          node tests/lesson-browser.mjs
          node tests/home-browser.mjs
          node tests/course-race-browser.mjs
          node tests/course-browser.mjs
          node tests/course-flow-browser.mjs
          node tests/course-help-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/dist
          retention-days: 14
      - name: Deploy verified build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf "$RELEASE.tar.gz" -C app/dist .
          scp -o BatchMode=yes -o ConnectTimeout=30 "$RELEASE.tar.gz" fretdeploy@43.142.118.254:/srv/fret2tone/incoming/
          ssh -o BatchMode=yes -o ConnectTimeout=30 fretdeploy@43.142.118.254 "/usr/local/bin/fret2tone-activate $RELEASE"
          rm ~/.ssh/id_ed25519
