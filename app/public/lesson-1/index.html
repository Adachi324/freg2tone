<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一节 · 听见音程</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ea;color:#253b34;font:17px/1.65 system-ui}main{max-width:1040px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;align-items:center}small,.muted{color:#627369}h1{font-size:clamp(30px,5vw,48px);margin:12px 0}h2{margin-top:0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}button{font:inherit;border:1px solid #b8c7b8;border-radius:10px;padding:10px 16px;background:#fffdf7;color:inherit;cursor:pointer}button:hover{background:#e3eddd}button:focus-visible{outline:3px solid #b07822}button[aria-current=true],.primary{background:#285845;color:white}button:disabled{opacity:.5;cursor:default}section{background:#fffdf7;border:1px solid #dce0d5;border-radius:20px;padding:26px;margin-bottom:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.board{overflow:auto;padding:12px 0}.strings{min-width:830px;display:grid;grid-template-columns:65px repeat(13,minmax(58px,1fr));gap:5px}.strings button{padding:10px 0;border-radius:50%;min-height:44px;background:#f0e5ce}.strings .selected{background:#285845;color:white}.strings .sounding{box-shadow:0 0 0 4px #cc8531}.strings .root{border:3px solid #b07822}.notice{background:#e6eddf;padding:14px;border-radius:10px;min-height:52px}p{max-width:76ch}table{width:100%;text-align:left}td,th{padding:8px;border-bottom:1px solid #ddd}footer{margin:20px 0;font-size:14px}#warning{color:#9a3b18}
body{background:radial-gradient(ellipse at 10% 5%,#ffdedb99,transparent 50%),radial-gradient(ellipse at 90% 40%,#ffe7d099,transparent 55%),#fff;color:#342e39}section{background:#ffffffb8;backdrop-filter:blur(22px);border:1px solid #fff;border-radius:28px;box-shadow:0 12px 40px #653a4c0c}button{border-radius:28px;border-color:#eadfe4;background:#fff9fc;min-height:44px}button[aria-current=true],.primary{background:#865c73;color:white}.notice{background:#f5eaf0}a{color:#76526a}details summary{cursor:pointer;padding:12px}textarea{font:inherit;border:1px solid #d8c5ce;border-radius:16px;padding:14px}.strings{gap:0}.strings button{background:linear-gradient(transparent 48%,#b7a9ad 49%,#b7a9ad 51%,transparent 52%);border:0;border-right:1px solid #e5dce0;border-radius:0}.strings .selected{background:#e7c9da;color:#30232d}.strings .root{outline:2px solid #ac783d;outline-offset:-4px}@media(max-width:600px){main{padding:18px 14px}section{padding:18px}nav{gap:6px}nav button{padding:9px 12px;font-size:14px}header{align-items:start;gap:10px}}
</style><main><div style="display:flex;gap:20px;margin-bottom:20px;font-size:14px"><a href="../home/">首页</a><a href="../explore/">自由探索</a><a href="../wiki/">知识 Wiki</a><span aria-current="page">章节学习</span></div><header><strong>音与关系 / 学习实验</strong><small>第一节 · 只练三个音程</small></header><h1>把音程，听出来、找出来。</h1><p class="muted">先看与听，再换起音独立尝试。允许慢慢数、反复听；不把完成题目等同于实琴演奏能力。</p><nav id="nav"></nav><div id="warning" role="status"></div><p id="playback-status" role="status" aria-live="polite">点击播放按钮试听；可随时停止或切换。</p><div id="content"></div><footer>标准调弦 · 1 弦最细 · 合成示范音（非真实吉他录音）<br>进度仅保存在此浏览器。隔天复测按本机日历日期开放。耳机与适中音量更便于比较。</footer></main>
<script type="module">
import {createPlayer} from '../explore/audio.js';
import {day,available,submit,markHelp,applyVisit,name,label,sets} from './model.js';
const key='mg-lesson-one-v1';let state={mode:'diagnosis',records:{},completed:null,version:2};let storage=true;
try{const s=JSON.parse(localStorage.getItem(key));if(s&&['diagnosis','learn','guided','practice','hearing','review','results'].includes(s.mode)&&s.records&&typeof s.records==='object'&&!Array.isArray(s.records)&&(!s.completed||/^\d{4}-\d{2}-\d{2}$/.test(s.completed))){state=s;for(const [k,r]of Object.entries(state.records))if(!r||(r.first!==null&&(!Number.isFinite(r.first)||r.first<0||r.first>127))||!Number.isInteger(r.attempts)||typeof r.correct!=='boolean'){try{localStorage.setItem(key+'-invalid-backup',localStorage.getItem(key));}catch{} state.invalidRecords=true;delete state.records[k];}}else if(s){localStorage.setItem(key+'-invalid-backup',localStorage.getItem(key));state.invalidRecords=true;}}catch{try{const raw=localStorage.getItem(key);if(raw){localStorage.setItem(key+'-invalid-backup',raw);state.invalidRecords=true;}}catch{storage=false;}}
let selected=null,selectedString=null,help=false,demo=4,heard=false;const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{storage=false;}$('#warning').textContent=storage?(state.invalidRecords?'部分旧记录格式异常，已保留原始备份 mg-lesson-one-v1-invalid-backup；异常题目暂不计入结果。':''):'无法保存本地记录；当前练习仍可进行，刷新可能丢失。';}
const player=createPlayer(n=>{document.querySelectorAll('[data-note]').forEach(b=>b.classList.toggle('sounding',Number(b.dataset.note)===n));},()=>{},message=>{document.querySelector('#playback-status').textContent=message;},message=>{document.querySelector('#playback-status').textContent=message;},{stepSeconds:.75,tailSeconds:-.05});
function stop(){player.stop();}
function play(notes,durations){return player.play(notes,durations);}
const id=(m,i)=>m+'-'+i;
function index(){return sets[state.mode]?.findIndex((_,i)=>!state.records[id(state.mode,i)]?.correct)??-1;}
function button(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b;}
function render(){state.learnStep=Number.isInteger(state.learnStep)?Math.max(0,Math.min(2,state.learnStep)):0;state.guidedStep=state.guidedStep===1?1:0;save();const nav=$('#nav');nav.replaceChildren();for(const [m,t]of Object.entries({diagnosis:'01 起点诊断',learn:'02 看与听',guided:'03 引导练习',practice:'04 换起音',hearing:'05 独立听觉',review:'06 隔天复测',results:'学习记录'})){const b=button(t,()=>{if(m==='learn'||m==='guided')markPending();stop();state.mode=m;selected=null;help=false;heard=false;render()});b.setAttribute('aria-current',String(state.mode===m));nav.append(b)}const boardScroll=document.querySelector('.board')?.scrollLeft??0;const wasBoardOpen=Boolean(document.querySelector('details[open]'));const c=$('#content');c.innerHTML='';
if(state.mode==='diagnosis'){c.innerHTML='<section><h2>先留下你的起点</h2><p>允许不知道；不计速度，不提前给答案。</p><p>1 弦 5 品 A4 的向上大三度在哪里？写下音名、品位和半音数。3 弦 2 品 A3 的向上小三度，在 2 弦哪里？</p><textarea id="diagnostic" aria-label="诊断首答" rows="4" style="width:100%"></textarea><div class="actions" id="diagnostic-actions"></div></section>';$('#diagnostic').value=state.diagnosis??'';$('#diagnostic').disabled=state.diagnosis!==undefined;$('#diagnostic-actions').append(button('记录首答并学习',()=>{state.diagnosis??=$('#diagnostic').value||'不知道';state.mode='learn';render()}),button('不知道，开始学习',()=>{state.diagnosis??='不知道';state.mode='learn';render()}));return;}
if(state.mode==='results'){c.innerHTML='<section><h2>分开看待每一种证据</h2><p>关系理解与推算：诊断文字单独记录，尚未自动评价。屏幕指板定位与迁移：见换起音记录。听觉比较：见独立听觉记录。首答、重试、提示分别记录；实际吉他演奏始终未验证。</p><table><thead><tr><th>题目</th><th>完成方式</th><th>提交次数</th></tr></thead><tbody></tbody></table></section>';const diagnostic=document.createElement('p');diagnostic.textContent='关系理解诊断首答：'+(state.diagnosis??'未作答');c.querySelector('section').append(diagnostic);for(const [k,r]of Object.entries(state.records)){const tr=document.createElement('tr');for(const text of [({practice:'换起音',hearing:'独立听觉',review:'隔天复测'}[k.split('-')[0]]||'练习')+' 第 '+(Number(k.split('-')[1])+1)+' 题（首答 '+(r.first===null?'未提交':name(r.first))+'）',r.correct?(r.help?'提示后完成':r.attempts>1?'重试后完成':'独立首答完成'):'尚未完成',r.attempts]){const td=document.createElement('td');td.textContent=String(text);tr.append(td)}c.querySelector('tbody').append(tr)}return;}
if(state.mode==='review'&&!available(state.completed)){c.innerHTML='<section><h2>让记忆隔一晚再接受检查</h2><p>'+ (state.completed?'你已完成当堂练习。下一日再回来，将用新起音复测。':'先完成换起音和独立听觉练习，再于下一日复测。')+'</p></section>';return;}
const learn=state.mode==='learn'||state.mode==='guided',i=index();if(!learn&&i<0){if(['practice','hearing'].every(m=>sets[m].every((_,i)=>state.records[id(m,i)]?.correct))&&!state.completed)state.completed=day();save();c.innerHTML='<section><h2>本组练习已完成</h2><p>查看学习记录，区分独立首答与修正后的完成。当堂练习完成后可隔天复测；复测完成后可查看记录，尚不代表实琴演奏通过。</p></section>';return;}
const free=state.mode==='learn';const defaultRoot=free&&state.learnStep===2?55:67;const [root,d]=learn?[free?(state.listenRoot??defaultRoot):67,demo]:sets[state.mode][i];const auditory=state.mode==='hearing'||state.mode==='review'&&i>=2;if(!learn){const current=id(state.mode,i);if(state.activeId!==current){state.activeId=current;state.helpSeen=visitTime();save();}}const target=root+d;const requiredString=state.version===2&&state.mode==='practice'?[1,2,1,2][i]:null;
c.innerHTML=`<section><small>${learn?'示范 / 建立对应':`第 ${i+1} / 4 题 · ${auditory?'声音比较':'音程应用'}`}</small><h2>${learn?'同一个起音，改变距离':auditory?'听参考，再找到第二个音':`从 ${name(root)} 出发，找向上的${label(d)}`}</h2><p>${learn?'同弦每移动一品是一个半音。小三度 3、大三度 4、纯五度 7。先听示范，再在指板上选择音并试听。':auditory?'起音为 '+name(root)+'。目标可能是小三度、大三度或纯五度；反复听、试弹比较都可以。':'金色边框是起音。按本题指定的弦寻找同一实际音高；旧版记录没有指定弦限制。先选位置，再提交。'}</p><div class="actions" id="controls"></div><small>左右滑动指板查看 0–12 品；金框标记起音。</small><div class="board"><div class="strings" id="board"></div></div><p id="selection">尚未选择目标位置。</p><div class="actions" id="answer"></div><div class="notice" role="status" id="feedback">${learn?'金框是试听起音 '+name(root)+'。选择指板音可试听；示范按钮会恢复对应曲例起音。':'首次提交会保留；获得答案提示后的结果会单独标记。'}</div></section>`;
if(learn){const explanation=document.createElement('div');explanation.innerHTML='<p>度数数音名字母，半音数表示音高距离：G–B 是三度，G–B♭也是三度，但分别相隔 4 和 3 个半音。G–A♯声音相同却是增二度拼写。</p><p>对照：G–B–D–B｜G 与 G–B♭–D–B♭｜G，只改变三音，不以快乐或悲伤判分。</p><p>《小星星》：G3–G3–D4–D4｜E4–E4–D4—。位置：3/0、3/0、2/3、2/3｜1/0、1/0、2/3。高八度版本为 G4–G4–D5–D5｜E5–E5–D5—，可在 1 弦 3、10、12 品尝试。时值 1、1、1、1｜1、1、2 拍。第二个 G 到第一个 D 是五度，最初两音是同音。</p><p>跨弦：3 弦 G3 到 2 弦 B3 相隔 4 半音；2 弦 B3 到 1 弦 E4 相隔 5 半音，不能复制相同手形。</p>';if(state.mode==='learn'){[...explanation.children].forEach((p,n)=>{if((state.learnStep===0&&n!==0)||(state.learnStep===1&&n!==1)||(state.learnStep===2&&n<2))p.remove();});c.querySelector('h2').textContent=['距离与度数','只改变一个音','在旋律和跨弦中找关系'][state.learnStep];if(state.learnStep>0)c.querySelector('section>p').textContent='按自己的节奏听、比较，再进入下一个知识点。';const steps=document.createElement('div');steps.className='actions';const prev=button('上一个知识点',()=>{stop();state.learnStep--;delete state.listenRoot;render()});prev.disabled=state.learnStep===0;steps.append(prev,button(state.learnStep===2?'进入引导练习':'下一个知识点',()=>{stop();if(state.learnStep===2)state.mode='guided';else state.learnStep++;delete state.listenRoot;render()}));explanation.append(steps);}
c.querySelector('section').insertBefore(explanation,$('#controls'));const details=document.createElement('details');details.open=wasBoardOpen;details.innerHTML='<summary>展开辅助指板（可选音试听）</summary>';const boardContainer=c.querySelector('.board');boardContainer.before(details);details.append(boardContainer);if(state.mode==='guided'){details.open=true;explanation.innerHTML='<p>引导任务：从 G4 找'+label(d)+'；先选择音试听，再检查位置。</p>';if(state.guidedStep===0){explanation.innerHTML+='<p>提示：'+label(d)+'向上移动 '+d+' 个半音；从 1 弦 3 品开始数移动次数。</p>';}else{c.querySelector('section>p').textContent='现在先自己推算，提示默认收起。需要时仍可主动查看。';}explanation.append(button(state.guidedStep===0?'收起提示，再练一次':'进入换起音独立应用',()=>{stop();selected=null;if(state.guidedStep===0){state.guidedStep=1;demo=3;}else state.mode='practice';render()}));}}
if(requiredString){const constraint=document.createElement('p');constraint.textContent='本题请在 '+requiredString+' 弦作答'+(i===3?'（从 3 弦 5 品 C4 跨弦迁移）':'');c.querySelector('section').append(constraint);}const controls=$('#controls');if(state.mode==='learn'&&state.learnStep===1){controls.append(button('短句 A · 大三度',()=>{stop();state.listenRoot=67;render();play([67,71,74,71,67],[1,1,1,1,4]);}),button('短句 B · 小三度',()=>{stop();state.listenRoot=67;render();play([67,70,74,70,67],[1,1,1,1,4]);}))}if(free&&state.learnStep===2){for(const [start,title] of [[55,'小星星 · G3 原音区'],[67,'小星星 · G4 高八度']])controls.append(button(title,()=>{stop();state.listenRoot=start;render();play([start,start,start+7,start+7,start+9,start+9,start+7],[1,1,1,1,1,1,2]);}));} if(learn&&(state.mode==='guided'||state.learnStep===0))for(const v of [3,4,7])controls.append(button(label(v),()=>{stop();demo=v;selected=null;render()}));controls.append(button('停止声音',stop));controls.append(button(learn?(free&&state.learnStep>0?'播放音程 · '+label(d):'播放示范'):auditory?'听参考音程':'听起音',async()=>{if(free&&target>76){$('#feedback').textContent='这个音程的目标超出当前指板最高音 E5，请选较低的试听起音；仍可只听所选音。';return;}heard=false;if(await play(learn||auditory?[root,target]:[root]))heard=true;},'primary'));
const board=$('#board');for(const [s,open]of [[1,64],[2,59],[3,55],[4,50],[5,45],[6,40]]){const span=document.createElement('span');span.textContent=s+' 弦';board.append(span);for(let fret=0;fret<=12;fret++){const n=open+fret;const b=button(learn?fret+' · '+name(n):String(fret),()=>{selected=n;selectedString=s;board.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#selection').textContent=`已选 ${s} 弦 ${fret} 品${learn?' · '+name(n):''}`;play([n])});b.setAttribute('aria-label',`${s}弦${fret}品`);if(learn)b.dataset.note=String(n);if(n===root)b.classList.add('root');if(selected===n&&selectedString===s)b.classList.add('selected');board.append(b)}}
document.querySelector('.board').scrollLeft=boardScroll;
if(selected!==null&&selectedString!==null){const open=[64,59,55,50,45,40][selectedString-1];$('#selection').textContent=`已选 ${selectedString} 弦 ${selected-open} 品${learn?' · '+name(selected):''}`;}
$('#answer').append(button('试听我的选择',()=>{if(selected!==null)play([root,selected]);else $('#feedback').textContent='请先在指板选择一个位置。'}));
if(free){$('#answer').append(button('将所选音设为试听起音',()=>{if(selected===null){$('#feedback').textContent='请先选择一个指板音。';return;}stop();state.listenRoot=selected;render();}),button('只听所选音',()=>{if(selected!==null)play([selected]);else $('#feedback').textContent='请先选择一个指板音。';}));}
if(state.mode==='guided'){$('#answer').append(button('检查位置',()=>{$('#feedback').textContent=selected===target?'位置正确。大小三度只差一个半音；换起音后再独立推算。':'从 G4 开始，数移动的次数而非把起点算一步。可先试听再修正。'}),button('查看推算提示',()=>{$('#feedback').textContent=`${label(d)}相隔 ${d} 个半音；1 弦 3 品向上移动 ${d} 品。`;}));}
if(!learn){$('#answer').append(button('提交答案',()=>{if(auditory&&!heard){$('#feedback').textContent='请先完整听一次参考音程，再提交。';return}if(selected===null){$('#feedback').textContent='请先选择目标音。';return}if(requiredString&&selectedString!==requiredString){$('#feedback').textContent='请在题目指定的弦上选择位置。';return;}const k=id(state.mode,i);state.records[k]=submit(state.records[k],selected,target,help);if(['practice','hearing'].every(m=>sets[m].every((_,i)=>state.records[id(m,i)]?.correct))&&!state.completed)state.completed=day();save();if(state.records[k].correct){$('#feedback').textContent='位置正确。'+(state.records[k].help?'本题记为提示后完成。':state.records[k].attempts>1?'本题记为重试后完成。':'本题记为独立首答完成。');$('#answer').replaceChildren(button('下一题',()=>{stop();selected=null;help=false;heard=false;render()},'primary'));}else $('#feedback').textContent=auditory?'尚未匹配。再听参考，比较两种声音。':`尚未匹配。你选的音比起音${selected>=root?'高':'低'} ${Math.abs(selected-root)} 个半音；请重新按题目关系推算。起点不算一次移动，跨弦时先核对空弦音高。`;},'primary'));$('#answer').append(button('需要提示',()=>{help=true;const k=id(state.mode,i);if(state.records[k])state.records[k].help=true;else state.records[k]={first:null,attempts:0,help:true,correct:false};save();$('#feedback').textContent=`目标是向上${label(d)}，相隔 ${d} 个半音。请从起音逐品推算。`}))}
}
function visitTime(){try{return Number(localStorage.getItem('mg-learning-help-visit'))||0;}catch{return 0;}}
function checkVisit(){applyVisit(state,visitTime());save();}
function markPending(){if(state.activeId){state.records[state.activeId]=markHelp(state.records[state.activeId]);save();}}
window.addEventListener('storage',e=>{if(e.key==='mg-learning-help-visit')checkVisit();});window.addEventListener('focus',checkVisit);
checkVisit();
document.querySelectorAll('a').forEach(a=>a.addEventListener('click',markPending));
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();heard=false;}});
window.addEventListener('resize',()=>document.querySelector('.selected')?.scrollIntoView({block:'nearest',inline:'nearest'}));
render();
</script></html>
