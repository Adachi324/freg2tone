<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由探索 · 音与关系</title><link rel="stylesheet" href="../explore/layout.css"><link rel="stylesheet" href="../explore/style.css"></head>
<body data-page="explore">
<header class="site-header"><a class="brand" href="../explore/" aria-label="音与关系，自由探索首页"><span class="brand-mark">♮</span>音与关系</a><nav aria-label="主导航"><a href="../explore/" aria-current="page">自由探索</a><a href="../wiki/">知识 Wiki</a><a href="../lesson-1/">章节学习 <span class="subtle">↗</span></a></nav><span class="header-note">听见关系，找到位置。</span></header>
<main class="workspace">
  <div class="page-heading"><div><p class="eyebrow">THE FRETBOARD / 自由探索</p><h1>在指板上，认识每一个音。</h1><p class="muted">点一下听声音，换一个主音，看关系怎样移动。</p></div><button id="open-wiki" class="outline" aria-haspopup="dialog">知识手册 <span aria-hidden="true">↗</span></button></div>
  <section class="instrument" aria-label="指板探索工具">
    <div class="toolbar"><button data-popup="key">调性：<span id="key-title">C 大调</span></button><button data-popup="add">＋ 添加内容</button><button data-popup="display">显示设置</button><button id="manual">知识手册</button></div>
    <div id="settings" hidden></div><div id="layers"></div>
    <div class="board-caption"><span>标准调弦 · 1 弦最细</span><span>0 为空弦 · 向右音高上升 <span aria-hidden="true">→</span></span></div>
    <div class="board-scroll" tabindex="0" role="region" aria-label="六弦指板，窄屏可左右滚动"><div id="fretboard" class="fretboard"></div></div>
    <div class="board-footer"><div class="legend"><span><i class="legend-root"></i>主音</span><span><i class="legend-note"></i>音阶内</span><span><i class="legend-out"></i>音阶外也可试听</span></div><span class="scroll-hint">左右滑动查看完整指板 ↔</span></div>
    <div class="selection-strip"><div><span class="eyebrow">刚刚听到</span><p id="selected-note" role="status">点选一个音，开始探索。</p></div><button id="stop">停止</button><button id="replay" disabled>↻ 再听一次</button></div>
    <p id="audio-status" class="audio-status" role="status"></p>
  </section>
  <section class="reading-links" aria-label="相关知识"><div><span class="eyebrow">从声音到理解</span><h2>想知道为什么？</h2><p class="muted">打开手册，边看边试。收起后继续刚才的探索。</p></div><div class="topic-links"><button data-topic="fretboard">01 <span>认识指板</span> ↗</button><button data-topic="intervals">02 <span>音程与距离</span> ↗</button><button data-topic="major">03 <span>音阶如何组成</span> ↗</button></div></section>
  <footer class="page-footer"><span>标准调弦 E–A–D–G–B–E · 合成拨弦音</span><span>自由试音，不计分。建议使用适中音量。</span></footer>
</main>
<dialog id="knowledge" class="knowledge-panel" aria-labelledby="panel-title"><div class="panel-top"><span class="eyebrow" id="panel-title">知识手册</span><button id="close-wiki" aria-label="关闭知识手册">✕</button></div><label class="article-picker">查阅主题<select id="article-select"></select></label><div id="panel-article" class="article-body"></div><div class="panel-actions" id="panel-actions"></div></dialog>
<script type="module" src="../explore/app.js"></script>
</body></html>
