<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#e5d7b8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23ebd9a8'/%3E%3Ctext x='8' y='30' font-size='30'%3E♪%3C/text%3E%3C/svg%3E" />
<script>
// This recovery entry must work even if the application module cannot load.
window.addEventListener('error', function (event) {
  if (!(event.target instanceof HTMLScriptElement) && !(event.target instanceof HTMLLinkElement && event.target.rel === 'stylesheet')) return;
  function recover() {
    if (document.getElementById('load-error')) return;
    const panel = document.createElement('section');
    panel.id = 'load-error'; panel.setAttribute('role', 'alert');
    panel.style.cssText = 'position:fixed;inset:0;z-index:1000;background:#e5d7b8;color:#393b30;display:grid;place-content:center;gap:20px;padding:30px;font:18px sans-serif';
    const message = document.createElement('p'); message.textContent = '花园资源没有加载完成，请重试。';
    const retry = document.createElement('button'); retry.textContent = '重新加载'; retry.style.cssText = 'min-height:48px;font:inherit;cursor:pointer';
    retry.onclick = function () { location.reload(); };
    panel.append(message, retry); document.body.append(panel); retry.focus();
  }
  if (document.body) recover(); else document.addEventListener('DOMContentLoaded', recover, { once: true });
}, true);
</script>
<title>声音之桥 · 调音花园</title>
</head>
<body>
<div id="app"><p class="boot">正在布置声音花园…</p></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
